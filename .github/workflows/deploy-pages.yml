name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Manual trigger from Actions tab

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Configure GitHub Packages authentication
        run: |
          [[ -n "$NODE_AUTH_TOKEN" ]] || (echo "Missing NODE_AUTH_TOKEN Actions secret." && exit 1)
          npm config set @ksimonnet:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          npm view @ksimonnet/utils version --registry=https://npm.pkg.github.com >/dev/null
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
